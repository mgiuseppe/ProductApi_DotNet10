# Weekly update pull requests (docs/CICD.md, section 2). Minor and patch updates are grouped per ecosystem
# to keep the number of pull requests low; majors come one by one.
version: 2
updates:
  - package-ecosystem: nuget
    directories: ["/src/*", "/tests/*"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
