# Pull request gates (docs/CICD.md, section 2): the same checks as /verify-and-commit, plus security scans.
# build-and-test, images, bicep and dependency-review are required checks (ruleset main-quality-gates); psrule is informational.
# Actions are pinned to a commit SHA, which cannot be moved like a tag; the comment is the version, Dependabot updates both.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the migration check compares with origin/main

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Also the vulnerable packages check: NuGet audit reports direct and transitive packages with known
      # vulnerabilities (NU1901-NU1904) as warnings, from severity low (default NuGetAuditLevel), and the
      # build below replays them as errors (-warnaserror)
      - name: Restore
        run: dotnet restore ProductApi.slnx

      - name: Format
        run: dotnet format ProductApi.slnx --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build ProductApi.slnx -c Release -warnaserror --no-restore

      - name: Unit tests
        run: |
          dotnet test tests/Domain.Tests -c Release --no-build
          dotnet test tests/Application.Tests -c Release --no-build

      - name: Integration tests (SQL Server via Testcontainers, Docker is available on the runner)
        run: dotnet test tests/Infrastructure.Tests -c Release --no-build

      - name: Shared migrations untouched (ADR-0009)
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-status origin/main...HEAD -- src/Infrastructure/Migrations/ \
            | grep -v '^A' | grep -v 'AppDbContextModelSnapshot.cs$' || true)
          if [ -n "$changed" ]; then
            echo "Migrations already on main were changed: fix with a new migration instead."
            echo "$changed"
            exit 1
          fi

      - name: No forgotten migration
        env:
          # The design-time host builds the app: connection strings must be non-empty (never used here)
          ConnectionStrings__DbConnection: Server=unused
          ConnectionStrings__MongoDb: mongodb://unused/productapi
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          dotnet ef migrations has-pending-model-changes --project src/Infrastructure --startup-project src/Api

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the API image
        run: docker build --target final -t productapi-api:ci .
      - name: Build the migrator image
        run: docker build --target migrator -t productapi-migrator:ci .
      # Fails only on critical vulnerabilities that have a fix: "high" on base images would mostly be noise
      - name: Scan the API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: productapi-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan the migrator image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: productapi-migrator:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true # installed by the previous step

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint and build (rules in infra/bicepconfig.json)
        run: |
          az bicep install
          for file in infra/main.bicep infra/shared.bicep; do
            az bicep lint --file "$file"
            az bicep build --file "$file" --stdout > /dev/null
          done

  # Blocks a pull request that adds a dependency with a known high or critical vulnerability
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Well-Architected rules on the Bicep templates: informational only, findings never block a merge.
  # Some are accepted trade-offs (public network access, no MongoDB backups, ADR-0011).
  psrule:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # The parameter files read pipeline values: placeholders are enough to expand the templates
      MONGO_ADMIN_PASSWORD: placeholder
      AZURE_CLIENT_ID: 00000000-0000-0000-0000-000000000000
      API_IMAGE: ghcr.io/placeholder/api:0
      MIGRATOR_IMAGE: ghcr.io/placeholder/migrator:0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PSRule needs the Bicep CLI to expand the templates: the standalone binary from the official release
      # (Microsoft's manual install for Linux), at a known path passed to PSRule
      - name: Install Bicep
        run: |
          curl -fsSLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version
          echo "PSRULE_AZURE_BICEP_PATH=/usr/local/bin/bicep" >> "$GITHUB_ENV"
      - uses: microsoft/ps-rule@46451b8f5258c41beb5ae69ed7190ccbba84112c # v2.9.0
        with:
          modules: PSRule.Rules.Azure
          summary: true
