# - docker compose up -d                      -> infrastructure only (sqlserver, mongo, aspire-dashboard, migrator): run the API with F5
# - docker compose --profile app up --build -d -> everything, API included (http://localhost:8080)
# Aspire dashboard: http://localhost:18888
# Host ports default to the ones in appsettings.Development.json and can be overridden in a .env file (see .env.example)
#
# Development only: do not use these settings in production

# Shared by api and migrator (both build the app host, so both need the two connection strings)
x-connection-strings: &connection-strings
  ConnectionStrings__DbConnection: "Server=sqlserver,1433;Database=productapi;User Id=sa;Password=ProductApi!Dev2026;TrustServerCertificate=True"
  ConnectionStrings__MongoDb: "mongodb://mongo:27017/productapi"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ProductApi!Dev2026" # must meet the SQL Server complexity policy; the database is created by the migrator
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mongo:
    image: mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      # Local use only: skip the login token printed in the logs
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "${DASHBOARD_PORT:-18888}:18888" # UI
      - "${OTLP_PORT:-4317}:18889"       # OTLP gRPC, for the API run with F5 (the containerized API uses the compose network)

  # Applies EF migrations, then exits: the api starts only if it succeeds
  migrator:
    build:
      context: .
      target: migrator
    environment:
      <<: *connection-strings
    depends_on:
      sqlserver:
        condition: service_healthy

  api:
    profiles: [app] # started only with --profile app
    build:
      context: .
      target: final
    environment:
      <<: *connection-strings
      ASPNETCORE_ENVIRONMENT: Development # exposes /openapi/v1.json
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      OpenAI__ApiKey: "${OPENAI_API_KEY:-}" # from .env: user-secrets are not available in the container
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started

volumes:
  mssqldata:
  mongodata:
